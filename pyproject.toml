[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mac-control"
version = "1.0.0"
description = "Production-grade, hands-free local voice automation harness for macOS"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Ayush Kumar" }
]
keywords = [
    "voice-control",
    "macos",
    "automation",
    "speech-recognition",
    "faster-whisper",
    "kokoro",
    "ollama",
    "hands-free"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: MacOS X",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Home Automation",
    "Topic :: System :: Operating System"
]
dependencies = [
    "pyaudio>=0.2.14",
    "SpeechRecognition>=3.10.0",
    "faster-whisper>=1.0.0",
    "kokoro>=0.8.4",
    "soundfile>=0.12.1",
    "numpy>=1.24.0",
    "playwright>=1.40.0"
]

[project.scripts]
mac-control = "main:main"
mac-control-daemon = "server:run_daemon"
mac-control-telemetry = "telemetry_cli:main"
mac-control-eval = "eval_runner:main"

[project.urls]
Homepage = "https://github.com/singhxayush/mac-control"
Repository = "https://github.com/singhxayush/mac-control"
